name: Deploy (Customer Website)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            export PATH="$(ls -d /www/server/nodejs/*/bin 2>/dev/null | tr '\n' ':')$PATH:/usr/local/bin"
            node -v && pm2 -v
            cd /www/wwwroot/akhi_customer_panel/akhilifestyle
            git pull origin main
            npm install --no-audit --no-fund
            npm run build
            pm2 describe akhi-customer >/dev/null 2>&1 && pm2 restart akhi-customer || pm2 start "npx next start -p 3005" --name akhi-customer
            pm2 save