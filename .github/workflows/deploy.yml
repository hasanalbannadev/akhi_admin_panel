name: Build & Deploy (Admin Panel)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          BACKEND_URL: http://127.0.0.1:8001

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true
          script: |
            export PATH="$(ls -d /www/server/nodejs/*/bin 2>/dev/null | tr '\n' ':')$PATH:/usr/local/bin"
            node -v && pm2 -v
            cd /www/wwwroot/akhi_admin_website/akhi_admin_panel
            git pull origin main
            echo "BACKEND_URL=http://127.0.0.1:8001" > .env.local
            npm install --no-audit --no-fund
            npm run build
            pm2 describe akhi-admin >/dev/null 2>&1 && pm2 restart akhi-admin || pm2 start "npx next start -p 3004" --name akhi-admin
            pm2 save